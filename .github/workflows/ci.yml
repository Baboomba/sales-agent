name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 사람과 에이전트가 쓰는 scripts/check.sh 를 그대로 부른다. CI 만의 검사를 따로 두지 않는다.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 서버 검사 (린트 · 포맷 · 타입 · 계층 경계 · 테스트 · 규칙 커버리지)
        run: scripts/check.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 화면 검사 (린트 · 포맷 · 타입 · 테스트 · 빌드)
        run: scripts/check.sh frontend

  # 끝단 테스트 — 화면 · 서버 · 시드 DB 를 띄우고 브라우저로 돈다. 모델은 가짜다 (NFR-005).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 화면 의존성
        run: npm ci
        working-directory: frontend
      - name: 테스트 브라우저
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: 끝단 테스트
        run: scripts/e2e.sh
      - name: 실패하면 녹화 · 스크린샷 · 추적을 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  # 검사를 통과한 커밋만 이미지가 된다. main 에 들어오면 GHCR 에 올린다.
  image:
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR 이미지 이름은 소문자여야 한다. 저장소 주인(Baboomba)에 대문자가 있다.
      - name: 이미지 이름
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 (main 이면 배포)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
