[project]
name = "sales-agent"
version = "0.1.0"
description = "매출 데이터에 자연어로 묻는 Text-to-SQL Agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "sqlglot>=30.21",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "mutmut>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 규칙과 막는 장치의 표는 docs/convention/enforcement.md 에 있다.
#   PGH  — 경고를 끄는 주석(# noqa · # type: ignore)을 쓰지 않는다 (code-style 1.1)
#   T20  — print 는 스크립트에서만 (code-style 2)
#   BLE  — 넓은 except 는 안전망 한 곳만 (code-style 2)
#   TID  — 목(mock) 라이브러리를 쓰지 않는다 (testing 7.1)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PGH", "T20", "BLE", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 문서에서 전각 문자를 쓴다

[tool.ruff.lint.isort]
# 모든 모듈은 from __future__ import annotations 로 시작한다 (code-style 2).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "목 라이브러리를 쓰지 않는다. 가짜는 tests/<도메인>/fake.py 에 둔다 (testing 7.1)."
"pytest_mock".msg = "목 라이브러리를 쓰지 않는다. 가짜는 tests/<도메인>/fake.py 에 둔다 (testing 7.1)."

[tool.ruff.lint.per-file-ignores]
# 스크립트 · 평가는 사람에게 진행을 알린다.
"scripts/*" = ["T20"]
"evaluation/*" = ["T20"]
# 예상하지 못한 오류를 실패 단계로 바꾸는 안전망은 이 한 곳뿐이다 (QRY-R012).
"app/query/usecase/query_flow.py" = ["BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: 실제 SQLite 파일로 확인한다"]

# 변이 테스트 — 테스트가 틀린 구현을 잡는지 기계로 확인한다 (docs/convention/review.md 2절).
# 판단이 있는 계층만 바꿔 본다. 계층이 생기면 여기에 더한다.
[tool.mutmut]
source_paths = [
    "app/query/rules/",
    "app/query/dependency/impl/sqlglot_analyzer.py",
    "app/query/dependency/impl/sqlite_sales_database.py",
    "app/query/dependency/impl/ollama_generator.py",
    "app/query/usecase/",
    "app/query/api/",
    "app/main.py",
    "app/config.py",
]
also_copy = ["app/"]
pytest_add_cli_args_test_selection = ["tests/query/", "tests/integration/test_sqlite_sales_database.py", "tests/integration/test_main_wiring.py", "tests/integration/test_ollama_client.py", "tests/test_main.py", "tests/test_config.py"]

# 의존 방향을 사람이 아니라 검사가 지킨다 (docs/architecture.md 2절).
[tool.importlinter]
root_package = "app"
include_external_packages = true

# 계약은 docs/convention/code-architecture.md 3절의 표와 같다.
[[tool.importlinter.contracts]]
name = "계층 — api → usecase → rules · dependency → model 로만 의존한다"
type = "layers"
layers = [
    "app.query.api",
    "app.query.usecase",
    "app.query.rules | app.query.dependency",
    "app.query.model",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "모델은 아무것도 모른다"
type = "forbidden"
source_modules = ["app.query.model"]
forbidden_modules = ["time", "random", "datetime", "os", "pathlib", "sqlite3", "app.query.rules", "app.query.dependency", "app.query.usecase", "app.query.api", "app.config", "app.main", "fastapi", "pydantic", "langgraph", "langchain_ollama", "langchain_core", "ollama", "httpx", "sqlglot"]

[[tool.importlinter.contracts]]
name = "규칙은 모델과 규칙만 안다"
type = "forbidden"
source_modules = ["app.query.rules"]
# 규칙은 파일 · 시각 · 난수 · DB 를 쓰지 않는다 — 같은 입력에 늘 같은 판단 (code-architecture 2.2).
forbidden_modules = ["time", "random", "datetime", "os", "pathlib", "sqlite3", "app.query.dependency", "app.query.usecase", "app.query.api", "app.config", "app.main", "fastapi", "pydantic", "langgraph", "langchain_ollama", "langchain_core", "ollama", "httpx", "sqlglot"]

[[tool.importlinter.contracts]]
name = "구현은 조립 루트만 안다"
type = "forbidden"
source_modules = ["app.query.api", "app.query.usecase", "app.query.rules", "app.query.model"]
forbidden_modules = ["app.query.dependency.impl", "app.main"]

[[tool.importlinter.contracts]]
name = "API 는 유스케이스만 부른다"
type = "forbidden"
source_modules = ["app.query.api"]
forbidden_modules = ["app.query.rules", "app.query.dependency"]
# 유스케이스를 거쳐 닿는 것은 된다 — 직접 부르는 것만 막는다.
allow_indirect_imports = true
