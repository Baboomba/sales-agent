# 검토자는 이 한 줄이면 된다:  docker compose up
# 처음에는 모델(약 1GB)을 받느라 몇 분 걸린다. 다 뜨면 http://localhost:8000
#
# Mac 에 Ollama 를 직접 설치해 두었다면 (Docker 안에서는 GPU 를 못 써 느리다):
#   OLLAMA_BASE_URL=http://host.docker.internal:11434 docker compose up --no-deps app

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 모델을 한 번 받고 끝나는 작업. 볼륨에 남으므로 두 번째부터는 바로 끝난다.
  model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    depends_on:
      model:
        condition: service_completed_successfully

volumes:
  ollama:
